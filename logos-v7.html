<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Workhorse AI — Ribbon W</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,800;1,800&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; }
  .section { padding: 64px 40px; }
  .section--dark { background: #0d0b09; }
  .section--light { background: #faf9f7; }
  h2 { font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 56px; }
  .section--dark h2 { color: #444; }
  .section--light h2 { color: #bbb; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 56px; }
  .concept { display: flex; flex-direction: column; align-items: center; gap: 20px; }
  .concept-label { font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; }
  .section--dark .concept-label { color: #444; }
  .section--light .concept-label { color: #bbb; }
  .logo-lockup { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .logo-inline { display: flex; align-items: center; gap: 14px; }
  .wordmark { font-size: 18px; font-weight: 800; font-style: italic; letter-spacing: -0.01em; text-align: center; line-height: 1.1; }
  .section--dark .wordmark { color: #ffffff; }
  .section--light .wordmark { color: #0d0b09; }
  .wordmark span { color: #b5341c; }
</style>
</head>
<body>

<!-- DARK -->
<div class="section section--dark">

      <div class="concept-label">1 — Rust Mark</div>
      <div class="logo-lockup">
        <svg width="140" height="90" viewBox="0 0 140 90" xmlns="http://www.w3.org/2000/svg">
          <!-- Three ribbon swoops forming a W -->
          <!-- Left arch: starts top-left, swoops down, tapers -->

                fill="none" stroke="#b5341c" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>

                fill="none" stroke="#b5341c" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div class="wordmark">WORKHORSE <span>AI</span></div>
      </div>
    </div>

      <div class="concept-label">2 — Circle Badge</div>

                  fill="none" stroke="white" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>

    </div>

    <!-- 3: Inline lockup -->

      <div class="concept-label">3 — Inline Lockup</div>
      <div class="logo-lockup">
        <div class="logo-inline">

            <path d="M 8,6 C 10,4 14,4 16,7 C 22,18 24,38 18,56 C 15,65 10,72 8,78 C 7,82 9,86 12,86 C 16,86 20,82 24,74 C 30,62 34,48 36,36 C 38,48 42,62 48,74 C 52,82 56,86 60,86 C 64,86 66,82 65,78 C 63,72 58,65 55,56 C 49,38 51,18 57,7 C 59,4 63,4 65,6"

                  fill="none" stroke="#b5341c" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <div class="wordmark" style="text-align:left;">WORKHORSE<br><span>AI</span></div>
        </div>
      </div>
    </div>

    <!-- 4: White mark, no container -->
    <div class="concept">
      <div class="concept-label">4 — White Mark</div>
      <div class="logo-lockup">
        <svg width="140" height="90" viewBox="0 0 140 90">

                fill="none" stroke="white" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div class="wordmark">WORKHORSE <span>AI</span></div>
      </div>
    </div>

  </div>
</div>
