<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Workhorse AI — W Mark v6</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,800;1,800&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; }
  .section { padding: 64px 40px; }
  .section--dark { background: #0d0b09; }
  .section--light { background: #faf9f7; }
  h2 { font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 56px; }
  .section--dark h2 { color: #444; }
  .section--light h2 { color: #bbb; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 56px; }
  .concept { display: flex; flex-direction: column; align-items: center; gap: 20px; }
  .concept-label { font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; }
  .section--dark .concept-label { color: #444; }
  .section--light .concept-label { color: #bbb; }
  .logo-lockup { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .logo-inline { display: flex; flex-direction: row; align-items: center; gap: 14px; }
  .wordmark { font-size: 18px; font-weight: 800; font-style: italic; letter-spacing: -0.01em; text-align: center; line-height: 1; }
  .section--dark .wordmark { color: #ffffff; }
  .section--light .wordmark { color: #0d0b09; }
  .wordmark span { color: #b5341c; }
</style>
</head>
<body>

<!-- DARK -->
<div class="section section--dark">
  <h2>Swoosh W Mark — Dark</h2>
  <div class="grid">

    <!-- 1: Rust on dark, standalone large -->
    <div class="concept">
      <div class="concept-label">1 — Mark Only (Rust)</div>
      <div class="logo-lockup">
        <svg width="120" height="80" viewBox="0 0 120 80" xmlns="http://www.w3.org/2000/svg">
          <!-- W made of 3 arch/swoosh shapes with thick strokes and rounded ends -->
          <!-- Left arch -->
          <path d="M 8,12 C 8,12 4,40 14,58 C 18,65 24,68 28,65 C 32,62 32,54 28,46 L 36,60 C 40,68 46,70 50,66 C 54,62 52,52 48,42" 
                fill="none" stroke="#b5341c" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
          <!-- Right arch -->
          <path d="M 72,42 C 68,52 66,62 70,66 C 74,70 80,68 84,60 L 92,46 C 88,54 88,62 92,65 C 96,68 102,65 106,58 C 116,40 112,12 112,12"
                fill="none" stroke="#b5341c" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
          <!-- Center peak -->
          <path d="M 48,42 C 52,32 56,18 60,14 C 64,18 68,32 72,42"
                fill="none" stroke="#b5341c" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div class="wordmark">WORKHORSE <span>AI</span></div>
      </div>
    </div>

    <!-- 2: White on rust circle -->
    <div class="concept">
      <div class="concept-label">2 — Circle Badge</div>
      <div class="logo-lockup">
        <svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <circle cx="50" cy="50" r="48" fill="#b5341c"/>
          <!-- W mark scaled to fit circle, white -->
          <g transform="translate(8,22) scale(0.7)">
            <path d="M 8,12 C 8,12 4,40 14,58 C 18,65 24,68 28,65 C 32,62 32,54 28,46 L 36,60 C 40,68 46,70 50,66 C 54,62 52,52 48,42" 
                  fill="none" stroke="white" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M 72,42 C 68,52 66,62 70,66 C 74,70 80,68 84,60 L 92,46 C 88,54 88,62 92,65 C 96,68 102,65 106,58 C 116,40 112,12 112,12"
                  fill="none" stroke="white" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M 48,42 C 52,32 56,18 60,14 C 64,18 68,32 72,42"
                  fill="none" stroke="white" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
          </g>
        </svg>
        <div class="wordmark">WORKHORSE <span>AI</span></div>
      </div>
    </div>

    <!-- 3: Inline lockup — mark + wordmark side by side -->
    <div class="concept">
      <div class="concept-label">3 — Inline Lockup</div>
      <div class="logo-lockup">
        <div class="logo-inline">
          <svg width="60" height="40" viewBox="0 0 120 80" xmlns="http://www.w3.org/2000/svg">
            <path d="M 8,12 C 8,12 4,40 14,58 C 18,65 24,68 28,65 C 32,62 32,54 28,46 L 36,60 C 40,68 46,70 50,66 C 54,62 52,52 48,42" 
                  fill="none" stroke="#b5341c" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M 72,42 C 68,52 66,62 70,66 C 74,70 80,68 84,60 L 92,46 C 88,54 88,62 92,65 C 96,68 102,65 106,58 C 116,40 112,12 112,12"
                  fill="none" stroke="#b5341c" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M 48,42 C 52,32 56,18 60,14 C 64,18 68,32 72,42"
                  fill="none" stroke="#b5341c" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <div class="wordmark" style="text-align:left;">WORKHORSE<br><span>AI</span></div>
        </div>
      </div>
    </div>

    <!-- 4: White mark on dark, no background shape -->
    <div class="concept">
      <div class="concept-label">4 — White Mark</div>
      <div class="logo-lockup">
        <svg width="120" height="80" viewBox="0 0 120 80" xmlns="http://www.w3.org/2000/svg">
          <path d="M 8,12 C 8,12 4,40 14,58 C 18,65 24,68 28,65 C 32,62 32,54 28,46 L 36,60 C 40,68 46,70 50,66 C 54,62 52,52 48,42" 
                fill="none" stroke="white" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M 72,42 C 68,52 66,62 70,66 C 74,70 80,68 84,60 L 92,46 C 88,54 88,62 92,65 C 96,68 102,65 106,58 C 116,40 112,12 112,12"
                fill="none" stroke="white" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M 48,42 C 52,32 56,18 60,14 C 64,18 68,32 72,42"
                fill="none" stroke="white" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div class="wordmark">WORKHORSE <span>AI</span></div>
      </div>
    </div>

  </div>
</div>

<!-- LIGHT -->

  <div class="grid">

                fill="none" stroke="#b5341c" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M 72,42 C 68,52 66,62 70,66 C 74,70 80,68 84,60 L 92,46 C 88,54 88,62 92,65 C 96,68 102,65 106,58 C 116,40 112,12 112,12"
                fill="none" stroke="#b5341c" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M 48,42 C 52,32 56,18 60,14 C 64,18 68,32 72,42"
                fill="none" stroke="#b5341c" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div class="wordmark">WORKHORSE <span>AI</span></div>
      </div>
    </div>

    <div class="concept">

        <svg width="100" height="100" viewBox="0 0 100 100">
          <circle cx="50" cy="50" r="48" fill="#b5341c"/>
          <g transform="translate(8,22) scale(0.7)">
            <path d="M 8,12 C 8,12 4,40 14,58 C 18,65 24,68 28,65 C 32,62 32,54 28,46 L 36,60 C 40,68 46,70 50,66 C 54,62 52,52 48,42" 
                  fill="none" stroke="white" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M 72,42 C 68,52 66,62 70,66 C 74,70 80,68 84,60 L 92,46 C 88,54 88,62 92,65 C 96,68 102,65 106,58 C 116,40 112,12 112,12"
                  fill="none" stroke="white" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M 48,42 C 52,32 56,18 60,14 C 64,18 68,32 72,42"
                  fill="none" stroke="white" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
          </g>
        </svg>
        <div class="wordmark">WORKHORSE <span>AI</span></div>
      </div>
    </div>

    <div class="concept">
      <div class="concept-label">3 — Inline Lockup</div>
      <div class="logo-lockup">
        <div class="logo-inline">
          <svg width="60" height="40" viewBox="0 0 120 80">
            <path d="M 8,12 C 8,12 4,40 14,58 C 18,65 24,68 28,65 C 32,62 32,54 28,46 L 36,60 C 40,68 46,70 50,66 C 54,62 52,52 48,42" 
                  fill="none" stroke="#b5341c" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M 72,42 C 68,52 66,62 70,66 C 74,70 80,68 84,60 L 92,46 C 88,54 88,62 92,65 C 96,68 102,65 106,58 C 116,40 112,12 112,12"
                  fill="none" stroke="#b5341c" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M 48,42 C 52,32 56,18 60,14 C 64,18 68,32 72,42"
                  fill="none" stroke="#b5341c" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <div class="wordmark" style="text-align:left;">WORKHORSE<br><span>AI</span></div>
        </div>
      </div>
    </div>

    <div class="concept">
      <div class="concept-label">4 — Dark Mark</div>
      <div class="logo-lockup">
        <svg width="120" height="80" viewBox="0 0 120 80">
          <path d="M 8,12 C 8,12 4,40 14,58 C 18,65 24,68 28,65 C 32,62 32,54 28,46 L 36,60 C 40,68 46,70 50,66 C 54,62 52,52 48,42" 
                fill="none" stroke="#1a1714" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M 72,42 C 68,52 66,62 70,66 C 74,70 80,68 84,60 L 92,46 C 88,54 88,62 92,65 C 96,68 102,65 106,58 C 116,40 112,12 112,12"
                fill="none" stroke="#1a1714" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M 48,42 C 52,32 56,18 60,14 C 64,18 68,32 72,42"
                fill="none" stroke="#1a1714" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div class="wordmark">WORKHORSE <span>AI</span></div>

  </div>
</div>

</body>
</html>
